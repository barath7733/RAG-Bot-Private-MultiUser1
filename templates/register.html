<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create account · AI Assistant</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="logo">🧠</div>
      <h1>Create your account</h1>
      <p class="auth-subtitle">Your own private documents, chats, and history</p>

      <div id="auth-error" class="auth-error"></div>

      <form id="register-form" class="auth-form">
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>
        <div class="form-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required />
        </div>
        <div class="form-field">
          <label for="confirm-password">Confirm password</label>
          <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" minlength="8" required />
        </div>
        <button type="submit" id="submit-btn" class="auth-submit-btn">Create account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="/login">Log in</a></p>
    </div>
  </div>

  <script src="/static/auth.js"></script>
  <script>
    setupAuthForm({
      formId: "register-form",
      submitBtnId: "submit-btn",
      submitLabel: "Create account",
      loadingLabel: "Creating account...",
      endpoint: "/api/auth/register",
      buildPayload: () => ({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
        confirm_password: document.getElementById("confirm-password").value,
      }),
      validate: () => {
        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirm-password").value;
        if (password.length < 8) return "Password must be at least 8 characters long.";
        if (password !== confirm) return "Passwords do not match.";
        return null;
      },
    });
  </script>
</body>
</html>
